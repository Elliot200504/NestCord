services:
  postgres:
    image: postgres:17-alpine
    container_name: nestcord-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nestcord
      POSTGRES_PASSWORD: nestcord
      POSTGRES_DB: nestcord
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nestcord -d nestcord']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
