name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a branch makes the run in progress pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          # Even-numbered release: Prisma does not support the odd ones.
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # The api and web import the shared and database packages from their dist,
      # so those have to be built before anything typechecks. `prisma generate`
      # runs as part of the database build and needs no live database.
      - name: Build workspace packages
        run: pnpm packages:build

      - name: Lint
        run: pnpm lint

      - name: Format
        run: pnpm format:check

      - name: Typecheck
        run: pnpm typecheck

      # Vitest only. The Playwright journeys need a seeded PostgreSQL and a
      # running stack, so they stay a local command (see README).
      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
